<svg xmlns="http://www.w3.org/2000/svg" width="760" height="820" viewBox="0 0 760 820">
  <rect width="760" height="820" fill="#0b1220"/>
  <style>
    text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    .title { fill:#dbe4f5; font-size:20px; font-weight:700; }
    .subtitle { fill:#6b7a99; font-size:12px; }
    .box { fill:#111a2e; stroke:#2a3a5f; stroke-width:1.5; rx:10; }
    .box2 { fill:#16213a; stroke:#38bdf8; stroke-width:1.5; rx:10; }
    .label { fill:#dbe4f5; font-size:14px; font-weight:600; }
    .sub { fill:#6b7a99; font-size:11px; }
    .arrow { stroke:#38bdf8; stroke-width:2; fill:none; }
    .arrow-dot { fill:#38bdf8; }
  </style>

  <text x="380" y="38" text-anchor="middle" class="title">Explainable AI-based Real-time Network Intrusion Detection System</text>
  <text x="380" y="60" text-anchor="middle" class="subtitle">基于机器学习与可解释AI的实时网络入侵检测与安全分析平台</text>

  <!-- 1. Traffic -->
  <rect x="280" y="90" width="200" height="52" class="box"/>
  <text x="380" y="112" text-anchor="middle" class="label">网络流量</text>
  <text x="380" y="130" text-anchor="middle" class="sub">Traffic</text>
  <line x1="380" y1="142" x2="380" y2="172" class="arrow"/>
  <circle cx="380" cy="174" r="3" class="arrow-dot"/>

  <!-- 2. Scapy -->
  <rect x="250" y="178" width="260" height="52" class="box"/>
  <text x="380" y="200" text-anchor="middle" class="label">Scapy 抓包 / pcap 回放</text>
  <text x="380" y="218" text-anchor="middle" class="sub">Packet Capture</text>
  <line x1="380" y1="230" x2="380" y2="260" class="arrow"/>
  <circle cx="380" cy="262" r="3" class="arrow-dot"/>

  <!-- 3. Feature Extractor -->
  <rect x="210" y="266" width="340" height="52" class="box"/>
  <text x="380" y="288" text-anchor="middle" class="label">特征提取 Feature Extractor</text>
  <text x="380" y="306" text-anchor="middle" class="sub">CICIDS 69 维流特征</text>
  <line x1="380" y1="318" x2="380" y2="348" class="arrow"/>
  <circle cx="380" cy="350" r="3" class="arrow-dot"/>

  <!-- 4. XGBoost IDS -->
  <rect x="240" y="354" width="280" height="52" class="box2"/>
  <text x="380" y="376" text-anchor="middle" class="label">XGBoost IDS 多分类模型</text>
  <text x="380" y="394" text-anchor="middle" class="sub">8 类威胁识别</text>

  <!-- branch -->
  <line x1="330" y1="406" x2="210" y2="438" class="arrow"/>
  <line x1="430" y1="406" x2="550" y2="438" class="arrow"/>

  <!-- 5a. Alert Engine -->
  <rect x="70" y="444" width="280" height="60" class="box"/>
  <text x="210" y="466" text-anchor="middle" class="label">告警引擎 Alert Engine</text>
  <text x="210" y="484" text-anchor="middle" class="sub">模型判定 + 行为启发式</text>
  <text x="210" y="498" text-anchor="middle" class="sub">端口扫描 / SYN洪泛</text>

  <!-- 5b. SHAP Explain -->
  <rect x="410" y="444" width="280" height="60" class="box"/>
  <text x="550" y="466" text-anchor="middle" class="label">SHAP 解释 Explainable AI</text>
  <text x="550" y="484" text-anchor="middle" class="sub">特征归因 · 检测依据</text>
  <text x="550" y="498" text-anchor="middle" class="sub">风险等级 · 处置建议</text>

  <!-- converge to dashboard -->
  <line x1="210" y1="504" x2="310" y2="548" class="arrow"/>
  <line x1="550" y1="504" x2="450" y2="548" class="arrow"/>

  <!-- 6. SOC Console -->
  <rect x="200" y="554" width="360" height="62" class="box2"/>
  <text x="380" y="576" text-anchor="middle" class="label">告警管理中心 · Web SOC 控制台</text>
  <text x="380" y="596" text-anchor="middle" class="sub">风险筛选排序 · 状态流转 · CSV 导出</text>
</svg>
